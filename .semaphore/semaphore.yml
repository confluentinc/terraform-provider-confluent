version: v1.0
name: Terraform Provider for Confluent Cloud Pipeline
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-2

auto_cancel:
  running:
    when: "branch != 'master'"

global_job_config:
  prologue:
    commands:
      - sem-version go 1.25.12
      - export "GOPATH=$(go env GOPATH)"
      - >-
        export
        "SEMAPHORE_GIT_DIR=${GOPATH}/src/github.com/confluentinc/${SEMAPHORE_PROJECT_NAME}"
      - 'export "PATH=${GOPATH}/bin:${PATH}"'
      - 'mkdir -vp "${SEMAPHORE_GIT_DIR}" "${GOPATH}/bin"'
      - checkout

# Raised from 2h so the merge-queue live-test block below (which only runs on
# gh-readonly-queue/* branches) has room; normal PR/branch runs finish in minutes
# and are unaffected -- this is a ceiling, not a fixed duration.
execution_time_limit:
  hours: 12

blocks:
  - name: Build & Test & Release
    # Explicit (empty) deps: Semaphore forbids mixing blocks with implicit and
    # explicit dependencies, and the merge-queue block below declares one.
    dependencies: []
    task:
      jobs:
        - name: "Build & Test & Release"
          execution_time_limit:
            hours: 2
          commands:
            - . vault-get-secret apif/terraform-provider-confluent/sonar-token
            - make all
            # Run make-release CI if the current commit is not tagged
            - if [[ -z $(git tag --points-at HEAD) ]]; then make release-ci; fi
            # Push coverage artifact
            - artifact push workflow coverage.txt
      epilogue:
        always:
          commands:
            # `tflogs` must match TF_LOG_DIR in the Makefile, or this silently pushes nothing.
            # Non-blocking so losing debug logs can't cost the test report below, and tarred so
            # hundreds of files are one upload. The agent is ephemeral; this push is the only copy.
            - if [ -d tflogs ]; then tar -czf tflogs.tar.gz tflogs && artifact push job tflogs.tar.gz --force; else echo "no terraform debug logs to push"; fi || true
            # In the epilogue so a failed run still reports; a timed-out or canceled one won't.
            # --ignore-missing covers `make all` failing before testacc writes its report.
            # --trim-output-to keeps the LAST N characters; the 1000 default drops the assertion.
            - test-results publish unit-report.xml acceptance-report.xml -N "build-test-release" --ignore-missing --trim-output-to 20000

  # Automatic pre-merge gate: GitHub merge queue builds a temporary
  # gh-readonly-queue/master/* branch (master + the queued PR(s)); this block runs
  # ONLY there, so the affected live tests must pass before the PR merges -- no
  # manual click. On normal PR/branch runs the `run/when` skips it, so this
  # pipeline's required check passes fast and the PR can enter the queue.
  # Requires: merge queue enabled on master, and this pipeline's check kept
  # required. If Semaphore does NOT build gh-readonly-queue branches, do NOT make
  # it required (the queue would deadlock waiting for a check that never runs).
  - name: "Relevant Live Tests (merge queue)"
    dependencies: ["Build & Test & Release"]
    run:
      when: "branch =~ '^gh-readonly-queue/'"
    task:
      jobs:
        - name: "Detect & run affected live tests"
          execution_time_limit:
            hours: 8
          commands:
            - . vault-sem-get-secret v1/ci/kv/apif/terraform-provider-confluent/live-testing-data
            - |
              set -e
              GROUPS="$(BASE_REF=origin/master bash scripts/live-test-affected-groups.sh)"
              echo "Affected live-test groups: $GROUPS"
              if [ "$GROUPS" = "NONE" ]; then
                echo "No provider code changed; skipping live tests."
              elif [ "$GROUPS" = "all" ]; then
                make live-test
                make live-test-rtce
              else
                make live-test TF_LIVE_TEST_GROUPS="$GROUPS"
                case ",$GROUPS," in *,core,*) make live-test-rtce ;; esac
              fi
      epilogue:
        always:
          commands:
            - test-results publish live-report.xml live-rtce-report.xml -N "live-tests-queue" --ignore-missing --trim-output-to 20000

after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          # 404s when the epilogue published nothing (timed out, or failed before tests ran).
          - test-results gen-pipeline-report || echo "no test results available"
      - name: Report SonarQube Results
        commands:
          - checkout
          - sem-version java 17
          - emit-sonarqube-data -a coverage.txt --enable_sonarqube_enterprise

promotions:
  - name: Draft a Release
    pipeline_file: goreleaser.yml
  - name: Run Live Integration Tests
    pipeline_file: live-tests.yml
  - name: Run Relevant Live Tests (PR)
    pipeline_file: live-tests-pr.yml
