version: v1.0
name: Live Integration Tests for Confluent Provider
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-2

auto_cancel:
  running:
    when: "false"

global_job_config:
  prologue:
    commands:
      - sem-version go 1.25.12
      - export "GOPATH=$(go env GOPATH)"
      - >-
        export
        "SEMAPHORE_GIT_DIR=${GOPATH}/src/github.com/confluentinc/${SEMAPHORE_PROJECT_NAME}"
      - 'export "PATH=${GOPATH}/bin:${PATH}"'
      - 'mkdir -vp "${SEMAPHORE_GIT_DIR}" "${GOPATH}/bin"'
      - checkout

execution_time_limit:
  hours: 24

blocks:
  - name: "Live Integration Tests"
    task:
      jobs:
        - name: "Run Live Tests"
          commands:
            # 1. Fetch secrets
            - . vault-sem-get-secret v1/ci/kv/apif/terraform-provider-confluent/live-testing-data
            - . vault-sem-get-secret v1/ci/kv/apif/terraform-provider-confluent/slack-notifications-live-testing

            # 2. The main script
            - |
              set -e

              trap '
                RC=$?
                if [ $RC -ne 0 ]; then
                  echo "Live tests failed, sending Slack notification..."

                  curl -X POST -H "Content-type: application/json" --data "{}" "$SLACK_WEBHOOK_URL"
                fi
                exit $RC
              ' EXIT

              # Your original test logic runs here
              case "$TF_LIVE_TEST_GROUPS" in
                "essential") TF_LIVE_TEST_GROUPS="core,kafka" ;;
                "all"|"") TF_LIVE_TEST_GROUPS="" ;;
                *) TF_LIVE_TEST_GROUPS="$TF_LIVE_TEST_GROUPS" ;;
              esac

              echo "Running live tests for: ${TF_LIVE_TEST_GROUPS:-all groups}"
              make live-test ${TF_LIVE_TEST_GROUPS:+TF_LIVE_TEST_GROUPS="$TF_LIVE_TEST_GROUPS"}

              # RTCE live tests run separately because they require their own env flags
              # (e.g. TF_ACC_REGION pinned to a region where RTCE is enabled in prod).
              # Skip if the caller asked for a specific group that isn't "core" or "all".
              case "$TF_LIVE_TEST_GROUPS" in
                ""|*core*) make live-test-rtce ;;
                *) echo "Skipping live-test-rtce (group filter excludes RTCE)" ;;
              esac
      epilogue:
        always:
          commands:
            # Epilogue so a failed run still reports (a timed-out or canceled one won't).
            # --ignore-missing covers live-rtce: most group filters skip it, and it never runs
            # at all if live-test fails first.
            - test-results publish live-report.xml live-rtce-report.xml -N "live-tests" --ignore-missing

after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          # 404s when the epilogue published nothing (timed out, or failed before tests ran).
          - test-results gen-pipeline-report || echo "no test results available"
