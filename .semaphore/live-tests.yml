version: v1.0
name: Live Integration Tests for Confluent Provider
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-2

auto_cancel:
  running:
    when: "false"

global_job_config:
  prologue:
    commands:
      - sem-version go 1.25.12
      - export "GOPATH=$(go env GOPATH)"
      - >-
        export
        "SEMAPHORE_GIT_DIR=${GOPATH}/src/github.com/confluentinc/${SEMAPHORE_PROJECT_NAME}"
      - 'export "PATH=${GOPATH}/bin:${PATH}"'
      - 'mkdir -vp "${SEMAPHORE_GIT_DIR}" "${GOPATH}/bin"'
      - checkout

execution_time_limit:
  hours: 24

blocks:
  - name: "Live Integration Tests"
    task:
      jobs:
        - name: "Run Live Tests"
          commands:
            # 1. Fetch secrets
            - . vault-sem-get-secret v1/ci/kv/apif/terraform-provider-confluent/live-testing-data
            - . vault-sem-get-secret v1/ci/kv/apif/terraform-provider-confluent/slack-notifications-live-testing

            # 1.5 Sweep leftover tf-live-* test topics from earlier runs BEFORE testing.
            # Standard clusters cap at 2500 partitions; leaked topics accumulate until every
            # topic create fails with 400 "would exceed 2500 total partitions" and the whole
            # suite wedges. Terraform destroys topics only when a run completes normally, so a
            # timed-out (24h limit) or canceled run leaks them. This runs pre-test rather than
            # in the epilogue because the epilogue is skipped on exactly those timeout/cancel
            # paths (see the epilogue comment below), so a pre-run sweep is the only placement
            # that reliably clears whatever the previous run left behind. Best-effort: it only
            # touches this provider's own tf-live-* topics and never fails the job.
            - |
              cleanup_leftover_topics() {
                cid="$1"; rest="$2"; key="$3"; secret="$4"
                if [ -z "$cid" ] || [ -z "$rest" ] || [ -z "$key" ] || [ -z "$secret" ]; then
                  echo "Skipping topic cleanup for ${cid:-<unset cluster>}: credentials not set"
                  return 0
                fi
                base="${rest%/}/kafka/v3/clusters/${cid}/topics"
                echo "Sweeping leftover tf-live-* topics on ${cid}..."
                curl -s -u "${key}:${secret}" "$base" \
                  | grep -oE '"topic_name":"tf-live-[^"]*"' \
                  | sed -E 's/^"topic_name":"//; s/"$//' \
                  | while IFS= read -r t; do
                      [ -n "$t" ] || continue
                      code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -u "${key}:${secret}" "${base}/${t}")
                      echo "  deleted ${t} (HTTP ${code})"
                    done
              }
              cleanup_leftover_topics "$KAFKA_STANDARD_AWS_CLUSTER_ID" "$KAFKA_STANDARD_AWS_REST_ENDPOINT" "$KAFKA_STANDARD_AWS_API_KEY" "$KAFKA_STANDARD_AWS_API_SECRET" || true
              cleanup_leftover_topics "$KAFKA_DEDICATED_AWS_CLUSTER_ID" "$KAFKA_DEDICATED_AWS_REST_ENDPOINT" "$KAFKA_DEDICATED_AWS_API_KEY" "$KAFKA_DEDICATED_AWS_API_SECRET" || true

            # 2. The main script
            - |
              set -e

              trap '
                RC=$?
                if [ $RC -ne 0 ]; then
                  echo "Live tests failed, sending Slack notification..."

                  curl -X POST -H "Content-type: application/json" --data "{}" "$SLACK_WEBHOOK_URL"
                fi
                exit $RC
              ' EXIT

              # Your original test logic runs here
              case "$TF_LIVE_TEST_GROUPS" in
                "essential") TF_LIVE_TEST_GROUPS="core,kafka" ;;
                "all"|"") TF_LIVE_TEST_GROUPS="" ;;
                *) TF_LIVE_TEST_GROUPS="$TF_LIVE_TEST_GROUPS" ;;
              esac

              echo "Running live tests for: ${TF_LIVE_TEST_GROUPS:-all groups}"
              make live-test ${TF_LIVE_TEST_GROUPS:+TF_LIVE_TEST_GROUPS="$TF_LIVE_TEST_GROUPS"}

              # RTCE live tests run separately because they require their own env flags
              # (e.g. TF_ACC_REGION pinned to a region where RTCE is enabled in prod).
              # Skip if the caller asked for a specific group that isn't "core" or "all".
              case "$TF_LIVE_TEST_GROUPS" in
                ""|*core*) make live-test-rtce ;;
                *) echo "Skipping live-test-rtce (group filter excludes RTCE)" ;;
              esac
      epilogue:
        always:
          commands:
            # In the epilogue so a failed run still reports; a timed-out or canceled one won't.
            # --ignore-missing covers live-rtce, which group filters skip and which never runs if
            # live-test fails first.
            # --trim-output-to keeps the LAST N characters; the 1000 default drops the assertion.
            - test-results publish live-report.xml live-rtce-report.xml -N "live-tests" --ignore-missing --trim-output-to 20000

after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          # 404s when the epilogue published nothing (timed out, or failed before tests ran).
          - test-results gen-pipeline-report || echo "no test results available"
